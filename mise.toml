[tools]
go = "1.26"

[env]
CGO_ENABLED = "0"

[tasks.run]
description = "Run the app against the local database"
run = "go run . -db database.sqlite"

[tasks.test]
description = "Run the tests"
run = ["go vet ./...", "go test ./..."]

[tasks.fmt]
description = "Format the Go code"
run = "gofmt -w ."

[tasks.build]
description = "Build for this machine"
run = "go build -trimpath -ldflags '-s -w' -o bin/quicklist ."

[tasks.build-linux]
description = "Build static Linux binaries for amd64 and arm64"
run = [
	"GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o bin/quicklist-linux-amd64 .",
	"GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o bin/quicklist-linux-arm64 .",
]

