{{define "content"}}
<div class="page-header">
	<div class="title">
		<h1>My Shop Lists</h1>
	</div>
	<div class="buttons">
		<form method="post" action="/shoplists">
			<input type="hidden" name="return" value="/shoplists">
			<button class="primary">Create list</button>
		</form>
	</div>
</div>

<section class="card">
	<table>
		<thead>
			<tr><th>Date</th><th>Products</th><th class="wide">Created At</th><th class="narrow"></th></tr>
		</thead>
		<tbody>
			{{range .Shoplists}}
			<tr>
				<td class="strong"><a href="/shoplists/{{.ID}}">{{displayDate .Date}}</a></td>
				<td>{{.ProductCount}}</td>
				<td class="muted wide">{{displayTimestamp .CreatedAt}}</td>
				<td class="narrow actions">
					<a class="button ghost icon" href="/shoplists/{{.ID}}" title="Edit" aria-label="Edit">{{template "icon-edit"}}</a>
					<form method="post" action="/shoplists/{{.ID}}/delete" hx-confirm="Are you sure you want to delete this shopping list?">
						<input type="hidden" name="return" value="/shoplists">
						<button class="ghost icon danger" title="Delete" aria-label="Delete">{{template "icon-trash"}}</button>
					</form>
				</td>
			</tr>
			{{else}}
			<tr><td colspan="4" class="empty">No shop lists found.</td></tr>
			{{end}}
		</tbody>
	</table>
</section>
{{end}}
