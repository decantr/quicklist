<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
	<title>{{.Title}} · Quick List</title>
	<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
	<link rel="manifest" href="/manifest.webmanifest">
	<style>{{styles .Theme}}</style>
	<script src="/static/htmx.min.js" defer></script>
	<script src="/static/app.js" defer></script>
	<script src="/static/alpine.min.js" defer></script>
</head>
<body hx-boost="true">
	<header class="nav">
		<a class="brand" href="/dashboard"><img src="/static/favicon.svg" alt="" width="24" height="24">Quick List</a>
		<nav>
			<a href="/dashboard" {{if eq .Title "Dashboard"}}aria-current="page"{{end}}>Dashboard</a>
			<a href="/shoplists" {{if or (eq .Title "Shop Lists") (eq .Title "Shopping List")}}aria-current="page"{{end}}>Shop Lists</a>
			<a href="/products" {{if eq .Title "Products"}}aria-current="page"{{end}}>Products</a>
		</nav>
	</header>

	<main>
		{{template "content" .}}
	</main>

	<footer class="footer">
		<form method="post" action="/theme" hx-boost="false">
			<input type="hidden" name="return" value="{{.Path}}">
			<label>Theme
				<select name="theme" onchange="this.form.requestSubmit()">
					{{range .Themes}}<option value="{{.}}" {{if eq . $.Theme}}selected{{end}}>{{themeLabel .}}</option>{{end}}
				</select>
			</label>
			<noscript><button>Apply</button></noscript>
		</form>
	</footer>

	<div class="toasts" id="toasts">
		{{with .Flash}}<div class="toast" x-data x-init="setTimeout(() => $el.remove(), 3000)">{{.Message}}</div>{{end}}
	</div>
</body>
</html>
