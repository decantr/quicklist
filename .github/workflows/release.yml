name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install_args: go

      - name: Run Tests
        run: mise run test

      - name: Build Linux binaries
        run: mise run build-linux

      - name: Write checksums
        working-directory: bin
        run: sha256sum quicklist-linux-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/* --generate-notes
