name: tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install_args: go

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Tests
        run: mise run test

      - name: Build Linux binaries
        run: mise run build-linux
