name: tests

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install_args: go

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Tests
        run: mise run test

      - name: Build Linux binaries
        run: mise run build-linux

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t quicklist:test .

      - name: Wait for the health check
        run: |
          docker run -d --name quicklist quicklist:test
          timeout 30 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" quicklist)" = healthy ]; do sleep 1; done'

      - name: Stop gracefully
        run: |
          docker stop quicklist
          test "$(docker inspect -f '{{.State.ExitCode}}' quicklist)" = 0
          docker logs quicklist 2>&1 | grep -q stopped

      - name: Show container logs
        if: failure()
        run: docker logs quicklist
