[tools]
go = "1.26"

[env]
CGO_ENABLED = "0"

[tasks.run]
description = "Run the app against the Laravel database"
run = "go run . -db ../database/database.sqlite"

[tasks.test]
description = "Run the Go tests"
run = "go test ./..."

[tasks.build]
description = "Build for this machine"
run = "go build -trimpath -ldflags '-s -w' -o bin/quicklist ."

[tasks.build-linux]
description = "Build static Linux binaries for amd64 and arm64"
run = [
	"GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o bin/quicklist-linux-amd64 .",
	"GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o bin/quicklist-linux-arm64 .",
]

[tasks.serve]
description = "Expose the app on the tailnet"
run = "tailscale serve --bg --https=8443 http://127.0.0.1:8080"
